[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "rueckbauradar-pipeline"
version = "0.1.0"
description = "Signal pipeline for RückbauRadar – early detection of demolition/hazmat remediation projects"
requires-python = ">=3.11"
dependencies = [
  # HTTP + async
  "httpx>=0.27",
  "aiohttp>=3.9",
  # Supabase
  "supabase>=2.4",
  "postgrest>=0.16",
  # PDF parsing
  "docling>=2.0",
  # Scraping
  "crawlee[beautifulsoup,playwright]>=0.4",
  "crawl4ai>=0.4",
  # LLM adapters (all optional at runtime, selected via env)
  "anthropic>=0.28",
  "openai>=1.30",
  # Data / validation
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  # Embeddings (OpenAI-compatible; any provider works)
  "tiktoken>=0.7",
  # Geo
  "geopy>=2.4",
  # Utilities
  "python-dotenv>=1.0",
  "tenacity>=8.3",
  "structlog>=24.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-httpx>=0.30",
  "ruff>=0.4",
  "mypy>=1.10",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["rueckbauradar/tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
