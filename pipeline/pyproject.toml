[project]
name = "rueckbauradar-pipeline"
version = "0.1.0"
description = "Signal pipeline for RückbauRadar – early detection of demolition/hazmat remediation projects"
requires-python = ">=3.11"
# Core: everything the fetch/classify/score/geocode/embed/dedupe/publish stages need.
dependencies = [
  "httpx>=0.27",
  "supabase>=2.4",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "anthropic>=0.28",
  "openai>=1.30",
  "python-dotenv>=1.0",
  "tenacity>=8.3",
  "structlog>=24.2",
]

[project.optional-dependencies]
# PDF parsing (Docling, MIT) – parse stage degrades gracefully without it
pdf = ["docling>=2.0"]
# HTML scraping (Crawlee + Crawl4AI, Apache 2.0) – used by allris/scrape adapters
scrape = [
  "crawlee[beautifulsoup]>=0.4",
  "crawl4ai>=0.4",
]
dev = [
  "pytest>=8.2",
  "ruff>=0.4",
  "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rueckbauradar", "rueckbauradar.stages", "rueckbauradar.adapters"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["rueckbauradar/tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
