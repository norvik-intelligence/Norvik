name: Signal Pipeline

on:
  schedule:
    # Run daily at 05:30 UTC
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      stages:
        description: "Pipeline stages to run (comma-separated)"
        required: false
        default: "fetch,parse,classify,score,geocode,embed,dedupe,publish"

jobs:
  pipeline:
    name: Run Signal Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pipeline

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pipeline/pyproject.toml"

      - name: Install dependencies
        run: pip install -e "." --quiet

      - name: Install Playwright browsers (for Crawlee/html_list_detail)
        run: playwright install chromium --with-deps
        continue-on-error: true  # non-fatal if scrape_html stage not used

      - name: Run pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMBEDDING_PROVIDER: ${{ secrets.EMBEDDING_PROVIDER || 'openai' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || 'signal@rueckbauradar.de' }}
        run: |
          STAGES="${{ github.event.inputs.stages || 'fetch,parse,classify,score,geocode,embed,dedupe,publish' }}"
          python run_pipeline.py --stages "$STAGES"

      - name: Upload pipeline log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log-${{ github.run_id }}
          path: pipeline/*.log
          retention-days: 7
          if-no-files-found: ignore
