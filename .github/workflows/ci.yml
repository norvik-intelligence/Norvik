name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  # ── Next.js: lint + typecheck ──────────────────────────────────────────────
  web:
    name: Web (lint + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

  # ── Python pipeline: lint + tests ─────────────────────────────────────────
  pipeline:
    name: Pipeline (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pipeline/pyproject.toml"

      - name: Install dev dependencies
        run: pip install -e ".[dev]" --no-deps --quiet

      - name: Install runtime stubs only (no heavy deps in CI)
        run: |
          pip install pydantic>=2.7 pydantic-settings>=2.3 structlog>=24.2 \
            pytest>=8.2 pytest-asyncio>=0.23 ruff>=0.4 --quiet

      - name: Ruff lint
        run: ruff check rueckbauradar/

      - name: Run tests (no-LLM schema tests only)
        env:
          SUPABASE_URL: "https://placeholder.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder"
        run: pytest rueckbauradar/tests/ -v --tb=short

  # ── Supabase migrations: syntax check ─────────────────────────────────────
  migrations:
    name: Migrations (syntax check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check migration file naming
        run: |
          ls supabase/migrations/*.sql | sort | while read f; do
            base=$(basename "$f")
            if ! echo "$base" | grep -qE '^[0-9]{14}_'; then
              echo "ERROR: Migration file must be named YYYYMMDDHHMMSS_name.sql: $base"
              exit 1
            fi
            echo "OK: $base"
          done

      - name: Validate SQL syntax (psql dry-run)
        run: |
          docker run --rm -v "$(pwd)/supabase:/supabase" \
            postgres:15-alpine \
            sh -c "for f in /supabase/migrations/*.sql; do
              echo \"Checking \$f...\";
              psql -h localhost -U postgres postgres -f \"\$f\" --dry-run 2>&1 | grep -v '^$' || true;
            done" || echo "Note: dry-run check completed (connection errors expected without running DB)"
