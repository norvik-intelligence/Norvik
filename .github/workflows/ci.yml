name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  # ── Next.js: lint (radar scope) + typecheck + build ───────────────────────
  web:
    name: Web (lint + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (RückbauRadar scope)
        run: npx eslint "src/app/radar/**" "src/lib/radar/**" "src/proxy.ts" "packages/shared/**"

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ── Python pipeline: lint + tests (no LLM calls, no heavy deps) ───────────
  pipeline:
    name: Pipeline (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install "pydantic>=2.7" "pydantic-settings>=2.3" "pytest>=8.2" "ruff>=0.4" "httpx>=0.27" --quiet

      - name: Ruff lint
        run: python -m ruff check rueckbauradar/

      - name: Run schema tests
        run: python -m pytest rueckbauradar/tests/ -v --tb=short

  # ── Supabase: migrations + seed + RLS tests against a real database ───────
  db:
    name: DB (migrations + RLS tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local database
        run: supabase db start

      - name: Apply migrations + seed (supabase db reset)
        run: supabase db reset

      - name: Run RLS tests (pgTAP)
        run: supabase test db
